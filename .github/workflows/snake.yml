# OPCIONAL — guardar como .github/workflows/snake.yml en el repo rubenmtzb/rubenmtzb
# Genera la animación de la serpiente con tu paleta (#030712 -> #00D9FF) en la rama "output".
# Tras el primer run (Actions -> Generate snake -> Run workflow), pega el bloque del final
# en el README, justo debajo de la sección `04 // Telemetry`.

name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      # temporal: permite ver la snake antes del merge (se quita despues)
      - feat/readme-redesign

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#0B1120,#0A3A5C,#0A84FF,#00D9FF,#7DF9FF
            dist/snake-light.svg?palette=github-light&color_snake=#0A84FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

