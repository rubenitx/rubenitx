<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="img" aria-label="">
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0A84FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#B14AED" stop-opacity="0.72"/>
      <stop offset="78%" stop-color="#00D492" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dDotB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B9BFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5B9BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dDotP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dDotG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EE9B5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5EE9B5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="1.5" fill="url(#dLine)"/>

  <g>
    <g>
      <circle cx="0" cy="7" r="7" fill="url(#dDotB)" opacity="0.85"/>
      <circle cx="0" cy="7" r="2" fill="#5B9BFF"/>
      <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="7" r="7" fill="url(#dDotP)" opacity="0.85"/>
      <circle cx="0" cy="7" r="2" fill="#C77DFF"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="7" r="7" fill="url(#dDotG)" opacity="0.85"/>
      <circle cx="0" cy="7" r="2" fill="#5EE9B5"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.7;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
      values="-40 0; 1040 0" dur="8s" repeatCount="indefinite"/>
  </g>
</svg>
