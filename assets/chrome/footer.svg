<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Barcelona, Spain — systems with intent">
  <defs>
    <linearGradient id="fAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#5EE9B5"/>
    </linearGradient>

    <radialGradient id="fAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0A84FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#B14AED" stop-opacity="0.8"/>
      <stop offset="78%" stop-color="#00D492" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#0E1B2E" stroke-width="1"/>
    </pattern>
    <linearGradient id="fPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DF9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7DF9FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fRail">
      <rect x="64" y="23" width="872" height="4"/>
    </clipPath>
    <clipPath id="fCard">
      <rect x="0" y="0" width="1000" height="130" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fCard)">
    <rect x="0" y="0" width="1000" height="130" fill="#030712"/>
    <rect x="0" y="0" width="1000" height="130" fill="url(#fGrid)"/>
    <ellipse cx="500" cy="140" rx="520" ry="130" fill="url(#fGlow)"/>

    <rect x="64" y="24" width="872" height="1.5" fill="url(#fLine)" opacity="0.6"/>
    <g clip-path="url(#fRail)">
      <rect x="-200" y="23" width="200" height="4" fill="url(#fPulse)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 1200 0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(500 58)">
      <circle r="26" fill="url(#fAura)">
        <animate attributeName="r" values="24;30;24" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke-width="2" stroke-linecap="round">
        <g>
          <path d="M0 -18 A18 18 0 0 1 15.6 9" stroke="#5B9BFF"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M0 -18 A18 18 0 0 1 15.6 9" stroke="#C77DFF"/>
          <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="9s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M0 -18 A18 18 0 0 1 15.6 9" stroke="#5EE9B5"/>
          <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="9s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle r="3.4" fill="#EAF9FF">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="500" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#64748B" letter-spacing="1.5">
      BARCELONA // SPAIN · SYSTEMS WITH INTENT
    </text>

    <circle cx="180" cy="52" r="1.4" fill="#5B9BFF">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="80" r="1.2" fill="#C77DFF">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="60" r="1.4" fill="#5EE9B5">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="86" r="1.2" fill="#00E5FF">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>

    <rect x="0.5" y="0.5" width="999" height="129" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
