<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="rubenitx.me — bilingual static portfolio with a hidden Killua Godspeed mini-game">
  <defs>
    <linearGradient id="pAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="55%" stop-color="#6FE3FF"/>
      <stop offset="100%" stop-color="#00D492"/>
    </linearGradient>
    <linearGradient id="pSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FE3FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6FE3FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6FE3FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FE3FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6FE3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D492" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8F4FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6FE3FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6FE3FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#0E1B2E" stroke-width="1"/>
    </pattern>
    <clipPath id="pCard"><rect x="0" y="0" width="720" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#pCard)">
    <rect width="720" height="280" fill="#030712"/>
    <rect width="720" height="280" fill="url(#pGrid)"/>
    <ellipse cx="140" cy="36" rx="270" ry="140" fill="url(#pGlowA)"/>
    <ellipse cx="640" cy="248" rx="260" ry="140" fill="url(#pGlowB)"/>

    <rect x="-300" y="0" width="300" height="280" fill="url(#pSweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1040 0" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.6" fill="#6FE3FF" opacity="0.9">STATIC · BILINGUAL · OPEN SOURCE</text>
    <circle cx="692" cy="30" r="3.4" fill="#00D492">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="682" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#94A3B8">LIVE</text>

    <!-- browser window -->
    <g>
      <rect x="28" y="52" width="404" height="196" rx="10" fill="#060D1A" stroke="#152436"/>
      <rect x="28" y="52" width="404" height="26" rx="10" fill="#0B1120"/>
      <rect x="28" y="70" width="404" height="8" fill="#0B1120"/>
      <line x1="28" y1="78" x2="432" y2="78" stroke="#152436" stroke-width="1"/>
      <circle cx="45" cy="65" r="3.2" fill="#FF2056" opacity="0.75"/>
      <circle cx="57" cy="65" r="3.2" fill="#FE9A00" opacity="0.75"/>
      <circle cx="69" cy="65" r="3.2" fill="#00D492" opacity="0.75"/>
      <rect x="86" y="58" width="200" height="14" rx="7" fill="#030712" stroke="#152436"/>
      <text x="98" y="68.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing="0.8" fill="#6FE3FF">rubenitx.me</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" letter-spacing="1">
        <rect x="374" y="58" width="22" height="14" rx="4" fill="#0A84FF" opacity="0.85"/><text x="385" y="68.5" text-anchor="middle" fill="#F1F5F9">EN</text>
        <rect x="400" y="58" width="22" height="14" rx="4" fill="#030712" stroke="#1E293B"/><text x="411" y="68.5" text-anchor="middle" fill="#64748B">ES</text>
      </g>

      <!-- page skeleton -->
      <rect x="52" y="98" width="150" height="11" rx="3" fill="#243349"/>
      <rect x="52" y="116" width="236" height="7" rx="3.5" fill="#152436"/>
      <rect x="52" y="130" width="186" height="7" rx="3.5" fill="#101B2B"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" letter-spacing="1">
        <rect x="52" y="150" width="52" height="15" rx="7.5" fill="#0B1120" stroke="#1B3550"/><text x="78" y="160.5" text-anchor="middle" fill="#6FE3FF">WORK</text>
        <rect x="110" y="150" width="42" height="15" rx="7.5" fill="#0B1120" stroke="#1E293B"/><text x="131" y="160.5" text-anchor="middle" fill="#64748B">CV</text>
        <rect x="158" y="150" width="66" height="15" rx="7.5" fill="#0B1120" stroke="#1E293B"/><text x="191" y="160.5" text-anchor="middle" fill="#64748B">ARCHIVE</text>
      </g>

      <!-- case cards -->
      <rect x="52" y="178" width="110" height="52" rx="7" fill="#0B1120" stroke="#152436"/>
      <rect x="52" y="178" width="110" height="3" rx="1.5" fill="#5B9BFF"/>
      <rect x="62" y="194" width="62" height="6" rx="3" fill="#1E293B"/>
      <rect x="62" y="206" width="86" height="5" rx="2.5" fill="#131B2B"/>
      <rect x="62" y="216" width="48" height="5" rx="2.5" fill="#131B2B"/>

      <rect x="172" y="178" width="110" height="52" rx="7" fill="#0B1120" stroke="#152436"/>
      <rect x="172" y="178" width="110" height="3" rx="1.5" fill="#00D492"/>
      <rect x="182" y="194" width="70" height="6" rx="3" fill="#1E293B"/>
      <rect x="182" y="206" width="86" height="5" rx="2.5" fill="#131B2B"/>
      <rect x="182" y="216" width="54" height="5" rx="2.5" fill="#131B2B"/>

      <rect x="292" y="178" width="118" height="52" rx="7" fill="#0B1120" stroke="#152436"/>
      <rect x="292" y="178" width="118" height="3" rx="1.5" fill="#6FE3FF"/>
      <rect x="302" y="194" width="58" height="6" rx="3" fill="#1E293B"/>
      <rect x="302" y="206" width="92" height="5" rx="2.5" fill="#131B2B"/>
      <rect x="302" y="216" width="66" height="5" rx="2.5" fill="#131B2B"/>
    </g>

    <!-- Godspeed easter egg: electric aura -->
    <g transform="translate(560 128)">
      <ellipse rx="86" ry="76" fill="url(#pAura)">
        <animate attributeName="ry" values="72;80;72" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>

      <g fill="none" stroke="#B8F4FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-66 -30 L-52 -16 L-64 -10 L-48 4">
          <animate attributeName="opacity" values="0;1;0.2;0;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M66 -28 L52 -14 L64 -8 L48 6">
          <animate attributeName="opacity" values="0;0;1;0.2;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M-30 -50 L-18 -38 L-30 -32 L-16 -22" stroke="#6FE3FF">
          <animate attributeName="opacity" values="0.2;0;0;1;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M30 46 L18 34 L30 28 L16 18" stroke="#6FE3FF">
          <animate attributeName="opacity" values="1;0.2;0;0;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M-34 44 L-22 32 L-34 26 L-20 16">
          <animate attributeName="opacity" values="0;0;0;0;1" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <g fill="none" stroke="#6FE3FF" stroke-width="1" opacity="0.5">
        <circle r="30">
          <animate attributeName="r" values="26;62" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle r="30">
          <animate attributeName="r" values="26;62" dur="3s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
        <text y="-4" text-anchor="middle" font-size="15" letter-spacing="3.5" fill="#EDF1F8">GODSPEED</text>
        <text y="12" text-anchor="middle" font-size="7.5" letter-spacing="2.4" fill="#6FE3FF">HIDDEN BEHIND THE HEADER</text>
      </g>
    </g>

    <!-- build stats -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing="1.1">
      <rect x="452" y="212" width="240" height="36" rx="8" fill="#0B1120" stroke="#152436"/>
      <text x="466" y="226" fill="#00D492">✓</text>
      <text x="478" y="226" fill="#94A3B8">14 pages · 0 client JS</text>
      <text x="466" y="240" fill="#00D492">✓</text>
      <text x="478" y="240" fill="#94A3B8">lighthouse 100 / 100</text>
    </g>

    <rect x="0" y="277" width="720" height="3" fill="url(#pAccent)" opacity="0.9"/>
  </g>
</svg>
