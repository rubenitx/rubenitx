<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="The Mutational Landscape of SARS-CoV-2 — interactive mutation portal across the viral genome">
  <defs>
    <linearGradient id="sAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#6FE3FF"/>
    </linearGradient>
    <linearGradient id="sSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6FE3FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6FE3FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#6FE3FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sGenome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6FE3FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FE3FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6FE3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#0E1B2E" stroke-width="1"/>
    </pattern>
    <clipPath id="sCard"><rect x="0" y="0" width="720" height="280" rx="14"/></clipPath>
    <clipPath id="sPlot"><rect x="28" y="96" width="664" height="104"/></clipPath>
  </defs>

  <g clip-path="url(#sCard)">
    <rect width="720" height="280" fill="#030712"/>
    <rect width="720" height="280" fill="url(#sGrid)"/>
    <ellipse cx="620" cy="40" rx="280" ry="150" fill="url(#sGlowA)"/>
    <ellipse cx="90" cy="250" rx="260" ry="140" fill="url(#sGlowB)"/>

    <rect x="-300" y="0" width="300" height="280" fill="url(#sSweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1040 0" dur="8.5s" repeatCount="indefinite"/>
    </rect>

    <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.6" fill="#6FE3FF" opacity="0.9">MUTATION LANDSCAPE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <rect x="592" y="20" width="100" height="18" rx="9" fill="#0B1120" stroke="#1B3550"/>
      <text x="642" y="33" text-anchor="middle" font-size="9" letter-spacing="1.4" fill="#6FE3FF">URV · IJMS</text>
    </g>
    <text x="28" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing="1.6" fill="#475569">29,903 bp · REFERENCE NC_045512.2</text>

    <!-- lollipop mutation plot -->
    <g clip-path="url(#sPlot)">
      <line x1="28" y1="200" x2="692" y2="200" stroke="#131B2B" stroke-width="1"/>
      <line x1="28" y1="170" x2="692" y2="170" stroke="#0E1725" stroke-width="1" stroke-dasharray="3 5"/>
      <line x1="28" y1="140" x2="692" y2="140" stroke="#0E1725" stroke-width="1" stroke-dasharray="3 5"/>
      <line x1="28" y1="110" x2="692" y2="110" stroke="#0E1725" stroke-width="1" stroke-dasharray="3 5"/>

      <g stroke="#1B3550" stroke-width="1">
        <line x1="52"  y1="200" x2="52"  y2="176"/><line x1="78"  y1="200" x2="78"  y2="158"/>
        <line x1="104" y1="200" x2="104" y2="186"/><line x1="132" y1="200" x2="132" y2="150"/>
        <line x1="158" y1="200" x2="158" y2="182"/><line x1="188" y1="200" x2="188" y2="166"/>
        <line x1="214" y1="200" x2="214" y2="190"/><line x1="244" y1="200" x2="244" y2="172"/>
        <line x1="272" y1="200" x2="272" y2="188"/><line x1="300" y1="200" x2="300" y2="160"/>
        <line x1="330" y1="200" x2="330" y2="184"/><line x1="358" y1="200" x2="358" y2="120"/>
        <line x1="386" y1="200" x2="386" y2="146"/><line x1="414" y1="200" x2="414" y2="178"/>
        <line x1="442" y1="200" x2="442" y2="132"/><line x1="470" y1="200" x2="470" y2="190"/>
        <line x1="498" y1="200" x2="498" y2="164"/><line x1="528" y1="200" x2="528" y2="186"/>
        <line x1="556" y1="200" x2="556" y2="154"/><line x1="584" y1="200" x2="584" y2="192"/>
        <line x1="612" y1="200" x2="612" y2="142"/><line x1="640" y1="200" x2="640" y2="180"/>
        <line x1="666" y1="200" x2="666" y2="168"/>
      </g>

      <g fill="#0A84FF">
        <circle cx="52" cy="176" r="2.6"/><circle cx="104" cy="186" r="2.2"/>
        <circle cx="158" cy="182" r="2.4"/><circle cx="214" cy="190" r="2.1"/>
        <circle cx="272" cy="188" r="2.2"/><circle cx="330" cy="184" r="2.4"/>
        <circle cx="414" cy="178" r="2.5"/><circle cx="470" cy="190" r="2.1"/>
        <circle cx="528" cy="186" r="2.2"/><circle cx="584" cy="192" r="2"/>
        <circle cx="640" cy="180" r="2.4"/>
      </g>
      <g fill="#6FE3FF">
        <circle cx="78" cy="158" r="3"/><circle cx="188" cy="166" r="2.9"/>
        <circle cx="244" cy="172" r="2.8"/><circle cx="300" cy="160" r="3.1"/>
        <circle cx="386" cy="146" r="3.3"/><circle cx="498" cy="164" r="3"/>
        <circle cx="556" cy="154" r="3.2"/><circle cx="666" cy="168" r="2.9"/>
      </g>

      <!-- high-frequency hotspots -->
      <circle cx="132" cy="150" r="3.6" fill="#7DF9FF"/>
      <circle cx="442" cy="132" r="3.8" fill="#7DF9FF"/>
      <circle cx="612" cy="142" r="3.7" fill="#7DF9FF"/>
      <g fill="none" stroke="#7DF9FF" stroke-width="1">
        <circle cx="358" cy="120" r="4">
          <animate attributeName="r" values="4;13" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.75;0" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
      <circle cx="358" cy="120" r="4.2" fill="#7DF9FF"/>

      <!-- scanning cursor -->
      <g>
        <line x1="0" y1="96" x2="0" y2="200" stroke="#6FE3FF" stroke-width="1" opacity="0.45"/>
        <animateTransform attributeName="transform" type="translate" values="28 0; 692 0; 28 0" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ORF track -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" letter-spacing="0.8">
      <rect x="28"  y="208" width="286" height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="171" y="217.5" text-anchor="middle" fill="#8FBBD9">ORF1ab</text>
      <rect x="318" y="208" width="104" height="13" rx="3" fill="#123A55" stroke="#2A5877"/><text x="370" y="217.5" text-anchor="middle" fill="#B8E4FF">S</text>
      <rect x="426" y="208" width="38"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="445" y="217.5" text-anchor="middle" fill="#8FBBD9">3a</text>
      <rect x="468" y="208" width="22"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="479" y="217.5" text-anchor="middle" fill="#8FBBD9">E</text>
      <rect x="494" y="208" width="40"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="514" y="217.5" text-anchor="middle" fill="#8FBBD9">M</text>
      <rect x="538" y="208" width="52"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="564" y="217.5" text-anchor="middle" fill="#8FBBD9">7a/8</text>
      <rect x="594" y="208" width="76"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/><text x="632" y="217.5" text-anchor="middle" fill="#8FBBD9">N</text>
      <rect x="674" y="208" width="18"  height="13" rx="3" fill="#0B2A44" stroke="#1B3550"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" letter-spacing="1.2" fill="#334155">
      <text x="28" y="234">0</text>
      <text x="360" y="234" text-anchor="middle">15,000</text>
      <text x="692" y="234" text-anchor="end">29,903</text>
    </g>

    <!-- legend -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" letter-spacing="1.2">
      <circle cx="32" cy="255" r="2.6" fill="#0A84FF"/><text x="42" y="258" fill="#475569">low</text>
      <circle cx="80" cy="255" r="2.9" fill="#6FE3FF"/><text x="90" y="258" fill="#475569">medium</text>
      <circle cx="150" cy="255" r="3.4" fill="#7DF9FF"/><text x="160" y="258" fill="#475569">hotspot</text>
      <text x="692" y="258" text-anchor="end" fill="#334155">D3.js · TYPESCRIPT · PHP · PYTHON</text>
    </g>

    <rect x="0" y="277" width="720" height="3" fill="url(#sAccent)" opacity="0.9"/>
  </g>
</svg>
