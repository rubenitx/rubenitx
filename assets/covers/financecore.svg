<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Finance Core — decoupled financial engine and client layer with accounts, spending and crypto">
  <defs>
    <linearGradient id="fAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00BC7D"/>
      <stop offset="100%" stop-color="#5EE9B5"/>
    </linearGradient>
    <linearGradient id="fSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D492" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D492" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D492" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D492" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EE9B5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5EE9B5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#0D1A22" stroke-width="1"/>
    </pattern>
    <clipPath id="fCard"><rect x="0" y="0" width="720" height="280" rx="14"/></clipPath>
    <clipPath id="fChart"><rect x="392" y="150" width="300" height="86"/></clipPath>
  </defs>

  <g clip-path="url(#fCard)">
    <rect width="720" height="280" fill="#030712"/>
    <rect width="720" height="280" fill="url(#fGrid)"/>
    <ellipse cx="120" cy="250" rx="280" ry="150" fill="url(#fGlowA)"/>
    <ellipse cx="620" cy="30" rx="260" ry="140" fill="url(#fGlowB)"/>

    <rect x="-300" y="0" width="300" height="280" fill="url(#fSweep)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1040 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.6" fill="#00D492" opacity="0.9">DECOUPLED ARCHITECTURE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <rect x="620" y="20" width="72" height="18" rx="9" fill="#0B1120" stroke="#243349"/>
      <text x="656" y="33" text-anchor="middle" font-size="9" letter-spacing="1.4" fill="#94A3B8">PRIVATE</text>
    </g>

    <!-- two decoupled halves with an explicit API boundary -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <rect x="28" y="58" width="298" height="72" rx="10" fill="#071A16" stroke="#12352B"/>
      <text x="46" y="80" font-size="9.5" letter-spacing="2" fill="#5EE9B5">FINANCIAL ENGINE</text>
      <text x="46" y="100" font-size="9" letter-spacing="1" fill="#64748B">FastAPI · PostgreSQL</text>
      <g font-size="8" letter-spacing="1">
        <rect x="46" y="108" width="62" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="77" y="119" text-anchor="middle" fill="#94A3B8">LEDGER</text>
        <rect x="114" y="108" width="66" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="147" y="119" text-anchor="middle" fill="#94A3B8">BUDGETS</text>
        <rect x="186" y="108" width="60" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="216" y="119" text-anchor="middle" fill="#94A3B8">CRYPTO</text>
      </g>

      <rect x="394" y="58" width="298" height="72" rx="10" fill="#08131F" stroke="#152436"/>
      <text x="412" y="80" font-size="9.5" letter-spacing="2" fill="#6FE3FF">CLIENT LAYER</text>
      <text x="412" y="100" font-size="9" letter-spacing="1" fill="#64748B">React · TypeScript</text>
      <g font-size="8" letter-spacing="1">
        <rect x="412" y="108" width="72" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="448" y="119" text-anchor="middle" fill="#94A3B8">CALENDAR</text>
        <rect x="490" y="108" width="60" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="520" y="119" text-anchor="middle" fill="#94A3B8">GOALS</text>
        <rect x="556" y="108" width="66" height="15" rx="4" fill="#0B1120" stroke="#1E293B"/><text x="589" y="119" text-anchor="middle" fill="#94A3B8">IMPORTS</text>
      </g>

      <!-- boundary -->
      <line x1="360" y1="52" x2="360" y2="136" stroke="#12352B" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="360" y="46" text-anchor="middle" font-size="8" letter-spacing="1.8" fill="#00D492">REST</text>
      <line x1="326" y1="94" x2="394" y2="94" stroke="#1B3B33" stroke-width="1.3"/>
      <circle r="2.8" fill="#5EE9B5">
        <animate attributeName="cx" values="330;390;330" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="94;94;94" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ledger rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9">
      <text x="28" y="164" font-size="8" letter-spacing="2" fill="#475569">MONTH TO DATE</text>
      <g>
        <rect x="28" y="172" width="300" height="20" rx="5" fill="#0B1120"/>
        <rect x="28" y="172" width="2.2" height="20" rx="1.1" fill="#00D492"/>
        <text x="42" y="186" fill="#94A3B8">Salary</text>
        <text x="316" y="186" text-anchor="end" fill="#5EE9B5">+2,480.00</text>
      </g>
      <g>
        <rect x="28" y="198" width="300" height="20" rx="5" fill="#0B1120"/>
        <rect x="28" y="198" width="2.2" height="20" rx="1.1" fill="#243349"/>
        <text x="42" y="212" fill="#94A3B8">Rent</text>
        <text x="316" y="212" text-anchor="end" fill="#64748B">−940.00</text>
      </g>
      <g>
        <rect x="28" y="224" width="300" height="20" rx="5" fill="#0B1120"/>
        <rect x="28" y="224" width="2.2" height="20" rx="1.1" fill="#243349"/>
        <text x="42" y="238" fill="#94A3B8">BTC · 0.0412</text>
        <text x="316" y="238" text-anchor="end" fill="#5EE9B5">+118.40</text>
      </g>
      <text x="28" y="262" font-size="7.5" letter-spacing="1.4" fill="#334155">SYNTHETIC DATA · NO BANK CONNECTION</text>
    </g>

    <!-- net worth chart -->
    <g>
      <text x="392" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" letter-spacing="2" fill="#475569">NET POSITION</text>
      <g clip-path="url(#fChart)">
        <path d="M392 232 L432 224 L472 228 L512 208 L552 214 L592 190 L632 196 L672 168 L692 172 L692 236 L392 236 Z" fill="url(#fArea)"/>
        <path d="M392 232 L432 224 L472 228 L512 208 L552 214 L592 190 L632 196 L672 168 L692 172" fill="none" stroke="url(#fAccent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="0" y1="150" x2="0" y2="236" stroke="#5EE9B5" stroke-width="1" opacity="0.35">
          <animate attributeName="x1" values="392;692;392" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="392;692;392" dur="7s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle cx="672" cy="168" r="3.2" fill="#5EE9B5">
        <animate attributeName="r" values="3.2;5.4;3.2" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <line x1="392" y1="248" x2="692" y2="248" stroke="#131B2B" stroke-width="1"/>
      <text x="392" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" letter-spacing="1.4" fill="#334155">JAN</text>
      <text x="692" y="262" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.5" letter-spacing="1.4" fill="#334155">DEC</text>
    </g>

    <rect x="0" y="277" width="720" height="3" fill="url(#fAccent)" opacity="0.9"/>
  </g>
</svg>
