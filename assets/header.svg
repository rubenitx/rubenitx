<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Rubén Martínez Bernabe — Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#5EE9B5"/>
    </linearGradient>

    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B14AED" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00D492" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DF9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7DF9FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B14AED" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#B14AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D492" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00D492" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#0E1B2E" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="240" rx="16"/>
    </clipPath>

    <clipPath id="railClip">
      <rect x="64" y="218" width="872" height="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1000" height="240" fill="#030712"/>
    <rect x="0" y="0" width="1000" height="240" fill="url(#grid)"/>
    <ellipse cx="140" cy="30" rx="320" ry="150" fill="url(#glowCyan)"/>
    <ellipse cx="880" cy="215" rx="320" ry="170" fill="url(#glowBlue)"/>
    <ellipse cx="742" cy="34" rx="260" ry="132" fill="url(#glowPurple)"/>
    <ellipse cx="360" cy="238" rx="300" ry="120" fill="url(#glowGreen)"/>

    <rect x="-360" y="0" width="360" height="240" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 1400 0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <circle cx="622" cy="210" r="1.6" fill="#5B9BFF">
      <animate attributeName="cy" values="212;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="702" cy="210" r="1.2" fill="#C77DFF">
      <animate attributeName="cy" values="212;36" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="944" cy="210" r="1.4" fill="#5EE9B5">
      <animate attributeName="cy" values="212;54" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="586" cy="210" r="1.2" fill="#00E5FF">
      <animate attributeName="cy" values="212;70" dur="10s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4.5s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(862 120)">
      <circle r="26" fill="none" stroke="#0A84FF" stroke-width="1.2" opacity="0.5">
        <animate attributeName="r" values="22;78" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="26" fill="none" stroke="#B14AED" stroke-width="1.2" opacity="0.45">
        <animate attributeName="r" values="22;78" dur="3.2s" begin="1.07s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="3.2s" begin="1.07s" repeatCount="indefinite"/>
      </circle>
      <circle r="26" fill="none" stroke="#00D492" stroke-width="1.2" opacity="0.4">
        <animate attributeName="r" values="22;78" dur="3.2s" begin="2.14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0" dur="3.2s" begin="2.14s" repeatCount="indefinite"/>
      </circle>

      <g fill="none" stroke-width="2.2" stroke-linecap="round">
        <g>
          <path d="M0 -32 A32 32 0 0 1 27.7 16" stroke="#5B9BFF"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M0 -23 A23 23 0 0 1 19.9 11.5" stroke="#C77DFF"/>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5.6s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M0 -14 A14 14 0 0 1 12.1 7" stroke="#5EE9B5"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
        </g>
      </g>

      <circle r="5" fill="#5B9BFF">
        <animate attributeName="opacity" values="1;0;0;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#C77DFF">
        <animate attributeName="opacity" values="0;1;0;0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#5EE9B5">
        <animate attributeName="opacity" values="0;0;1;0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="none" stroke="#EAF9FF" stroke-width="0.8" opacity="0.35">
        <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="936" y="46" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="url(#accent)" letter-spacing="2">
      BUILDING // ALWAYS
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <text x="64" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00D9FF" opacity="0.85">
      rubenitx@barcelona:~$ whoami
    </text>

    <text x="64" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#F8FAFC">
      Rubén Martínez Bernabe<tspan dx="10" fill="#00E5FF">▌<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>

    <text x="66" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#94A3B8">
      Software Engineer — APIs, integrations and web tools
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">
      <rect x="64" y="180" width="152" height="28" rx="14" fill="#0B1120" stroke="#12352B"/>
      <text x="80" y="198" fill="#5EE9B5">Java · Spring Boot</text>
      <rect x="228" y="180" width="152" height="28" rx="14" fill="#0B1120" stroke="#1B3550"/>
      <text x="244" y="198" fill="#5B9BFF">React · TypeScript</text>
      <rect x="392" y="180" width="134" height="28" rx="14" fill="#0B1120" stroke="#3B2A55"/>
      <text x="408" y="198" fill="#C77DFF">Docker · DevOps</text>
    </g>

    <rect x="64" y="219" width="872" height="2" fill="url(#lineFade)" opacity="0.7"/>
    <g clip-path="url(#railClip)">
      <rect x="-200" y="218" width="200" height="4" fill="url(#pulse)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 1200 0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
